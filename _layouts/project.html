---
layout: default
---
<div class="project-page">
  <a href="/projects" class="back-link">← Projects</a>

  <header class="page-header" style="margin-top: 1.25rem;">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-desc">{{ page.description }}</p>{% endif %}
    {% if page.status %}
    <span class="project-tag" style="margin-left:0; margin-top: 0.5rem; display:inline-block;">{{ page.status }}</span>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
