<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />
  <meta name="google-site-verification" content="E4jod4EPOYcZfOgBckeEAp7VtZ8Fv_NQN4CGGf-EPk0" />
  {% seo %}
</head>
<body>

  <header>
    <nav>
      <a href="{{ '/' | relative_url }}" class="nav-name">{{ site.title }}</a>
      <ul class="nav-links">
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/projects' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/blog' | relative_url }}">Blog</a></li>
        <li>
          <button class="dark-toggle" id="dark-toggle" aria-label="Toggle dark mode">
            <!-- icon injected by JS -->
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-name">{{ site.title }}</span>
      <ul class="footer-links">
        <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="mailto:{{ site.email }}">Email</a></li>
      </ul>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
